      It will be replaced with the URL of the `public` folder during the build.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will

    -->
    <title>PEL Client Management Software</title>
    <script>
      // Suppress ResizeObserver errors before React loads
      (function() {
        const originalError = window.onerror;
        window.onerror = function(message, source, lineno, colno, error) {
          const errorMessage = message?.toString() || error?.message?.toString() || '';
          if (errorMessage.includes('ResizeObserver loop') || 
              errorMessage.includes('ResizeObserver loop completed with undelivered notifications')) {
            return true; // Suppress ResizeObserver errors
          }
          if (originalError) {
            return originalError(message, source, lineno, colno, error);
          }
          return false;
        };

        // Suppress unhandled promise rejections
        window.addEventListener('unhandledrejection', function(event) {
          const errorMessage = event.reason?.message?.toString() || event.reason?.toString() || '';
          if (errorMessage.includes('ResizeObserver loop') || 
              errorMessage.includes('ResizeObserver loop completed with undelivered notifications')) {
            event.preventDefault();
          }
        });

        // Suppress error events
        window.addEventListener('error', function(event) {
          const errorMessage = event.message?.toString() || event.error?.message?.toString() || '';
          if (errorMessage.includes('ResizeObserver loop') || 
              errorMessage.includes('ResizeObserver loop completed with undelivered notifications')) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);

        // Intercept React error overlay hook when it's created
        // Use a polling approach to catch the hook when it's set up
        const checkAndInterceptHook = function() {
          if (window.__REACT_ERROR_OVERLAY_GLOBAL_HOOK__) {
            const hook = window.__REACT_ERROR_OVERLAY_GLOBAL_HOOK__;
            if (hook.onError && !hook._resizeObserverSuppressed) {
              const originalOnError = hook.onError;
              hook.onError = function(error) {
                const errorMessage = error?.message?.toString() || error?.toString() || '';
                if (errorMessage.includes('ResizeObserver loop') || 
                    errorMessage.includes('ResizeObserver loop completed with undelivered notifications')) {
                  return; // Suppress ResizeObserver errors
                }
                if (originalOnError) {
                  return originalOnError(error);
                }
              };
              hook._resizeObserverSuppressed = true;
            }
          } else {
            // Keep checking until the hook is available
            setTimeout(checkAndInterceptHook, 100);
          }
        };
        // Start checking immediately and after a delay
        checkAndInterceptHook();
        setTimeout(checkAndInterceptHook, 500);
        setTimeout(checkAndInterceptHook, 1000);
      })();
    </script>
